name: ci
on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python3 tools/validate_params.py
      - run: python3 tools/gen_params.py && git diff --exit-code -- ':(glob)proto-*/params.json' ':(glob)proto-*/params.lua' ':(glob)proto-*/params.h'

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install "gdtoolkit==4.5.0"
      - run: cd proto-godot && gdlint . && gdformat --check .

  # Headless sim test + Web export on the image that ships editor + templates.
  # The image tag is the Godot version; bump it with the README's pin.
  godot-export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4
      - run: cd proto-godot && godot --headless --path . --import
      - run: cd proto-godot && godot --headless --path . -s tests/test_sim.gd
      # Actions sets HOME=/github/home inside containers; the image keeps its
      # templates under /root, so expose them where the editor looks.
      - run: mkdir -p ~/.local/share/godot/export_templates && ln -s /root/.local/share/godot/export_templates/4.7.2.stable ~/.local/share/godot/export_templates/4.7.2.stable
      - run: cd proto-godot && mkdir -p dist && godot --headless --path . --export-release Web dist/index.html
      # Size budget deliberately not gated here: the stock template measures
      # 10.1 MB gzip against a 6 MB budget (D21, awaiting the owner).

  phaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.21.0" }
      - run: cd proto-phaser && npm ci --no-audit --no-fund
      - run: cd proto-phaser && npm run lint && npm run build
      - run: python3 tools/size_budget.py proto-phaser/dist 1500000

  love:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua-check
      - run: cd proto-love && luacheck .

  raylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: cd proto-raylib && make lint
      # Native compile needs raylib 6.0; Ubuntu's package lags. Build from
      # source in a later step or use a container image.

  bevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "proto-bevy" }
      # Bevy's Linux build set (docs/linux_dependencies.md): winit links
      # wayland-client + xkbcommon even for a check, not just ALSA and udev.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libx11-dev libasound2-dev libudev-dev
          libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev
      - run: cd proto-bevy && cargo fmt --check && cargo clippy --all-targets -- -D warnings
