name: ci
on:
  push:
  pull_request:

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: python3 tools/validate_params.py
      - run: python3 tools/gen_params.py && git diff --exit-code -- ':(glob)proto-*/params.json' ':(glob)proto-*/params.lua' ':(glob)proto-*/params.h'

  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      - run: pip install "gdtoolkit==4.5.0"
      - run: cd proto-godot && gdlint . && gdformat --check .
      # Web export needs the editor + templates; add barichello/godot-ci
      # once export_presets.cfg is committed.

  phaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24.21.0" }
      - run: cd proto-phaser && npm ci --no-audit --no-fund
      - run: cd proto-phaser && npm run lint && npm run build
      - run: python3 tools/size_budget.py proto-phaser/dist 1500000

  love:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua-check
      - run: cd proto-love && luacheck .

  raylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-format
      - run: cd proto-raylib && make lint
      # Native compile needs raylib 6.0; Ubuntu's package lags. Build from
      # source in a later step or use a container image.

  bevy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "proto-bevy" }
      # Bevy's Linux build set (docs/linux_dependencies.md): winit links
      # wayland-client + xkbcommon even for a check, not just ALSA and udev.
      - run: >-
          sudo apt-get update && sudo apt-get install -y
          pkg-config libx11-dev libasound2-dev libudev-dev
          libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev
      - run: cd proto-bevy && cargo fmt --check && cargo clippy --all-targets -- -D warnings
