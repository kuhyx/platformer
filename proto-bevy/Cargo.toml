[package]
name = "proto-bevy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Verify the current 0.19.x patch with `cargo search bevy` before building.
bevy = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

# Bevy's own recommendation: optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_pass_by_value = "allow" # Bevy systems take Res<T> by value
