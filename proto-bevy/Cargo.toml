[package]
name = "proto-bevy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Exact pins: the dependency-freshness gate compares each one against the
# newest stable on crates.io, which a caret range makes unanswerable.
bevy = "=0.19.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.105"

# Bevy's own recommendation: optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_pass_by_value = "allow" # Bevy systems take Res<T> by value
