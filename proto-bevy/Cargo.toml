[package]
name = "proto-bevy"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# Exact pins: the dependency-freshness gate compares each one against the
# newest stable on crates.io, which a caret range makes unanswerable.
# default-features = false: only what the slice draws and reads. No 3d, ui,
# audio, picking, scenes, post-processing (slice is rectangles, D13/D19).
bevy = { version = "=0.20.1", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_log",
    "bevy_window",
    "bevy_winit",
    "x11",
    "bevy_asset",
    "bevy_color",
    "bevy_camera",
    "bevy_image",
    "bevy_shader",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "default_font",
    "bevy_gilrs",
    "webgl2",
] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "=0.3.105"

# Bevy's own recommendation: optimise dependencies even in dev builds.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.bevy_render]
opt-level = 1

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
needless_pass_by_value = "allow" # Bevy systems take Res<T> by value
